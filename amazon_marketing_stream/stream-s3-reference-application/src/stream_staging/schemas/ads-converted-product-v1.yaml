# Generated dataset schema. Do not hand-edit field entries.
#
# Derived from a delivered Parquet footer. Verify the record key against the dataset guide before relying on it.
#
# Regenerate with:
#   stream-generate-schema --input <delivered.parquet> \
#       --dataset ads-converted-product-v1 --granularity daily \
#       --output schemas/ads-converted-product-v1.yaml
#
# Fields: 3 metadata, 17 dimensions (15 in the record key), 169 metrics.
#
# The record key is 15 of the 17 dimension fields; any others
# are carried as attributes and are annotated where they are declared. Omitting a key
# field causes two distinct records that agree on the remainder to be treated as
# versions of each other, and one of them to be discarded with no error reported.
#
# 'type' is an expectation, not a guarantee. It is compared against every
# delivered file and a lossy difference stops the job.

dataset: ads-converted-product-v1
granularity: daily
restatement_days: 70
version_field: streamBatch.version

# Coarsest first. Date bounds the restatement window; advertiser bounds the
# many advertisers that accumulate in one delivery destination.
partition_columns:
  - date.value
  - advertiseraccount.id

# Named coarse-grain groupings available to the aggregate job, selected with --grain.
# Declared here rather than in deployment configuration so that a table's name and its
# grouping cannot diverge. Every grain must lead with the event-date column, because an
# aggregate rebuild overwrites whole event-date partitions.
#
# product_day is the grain this dataset exists for. It groups by convertedproduct.id, a
# column the performance dataset does not have — which is why a single deployment-wide
# grain could never serve both datasets.
aggregate_grains:
  campaign_day:
    - date.value
    - advertiseraccount.id
    - adproduct.value
    - campaign.id
  product_day:
    - date.value
    - advertiseraccount.id
    - convertedproduct.id
  # Keeps both product columns, which is what makes the promoted-versus-halo split readable
  # from a coarse table. advertisedproduct.id and convertedproduct.id differ when an ad for
  # one product leads to the purchase of another; product_day keeps only the converted side, so
  # without this grain that comparison has to be run over fine grain.
  #
  # Deliberately not partitioned any finer than the others despite being the widest grain
  # here: the cardinality is bounded by the advertised-and-converted pairs that actually occur,
  # not by the Cartesian product of the two id sets.
  halo_day:
    - date.value
    - advertiseraccount.id
    - advertisedproduct.id
    - convertedproduct.id

