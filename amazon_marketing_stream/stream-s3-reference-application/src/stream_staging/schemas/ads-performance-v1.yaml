# Generated dataset schema. Do not hand-edit field entries.
#
# Derived from a delivered Parquet footer. Verify the record key against the dataset guide before relying on it.
#
# Regenerate with:
#   stream-generate-schema --input <delivered.parquet> \
#       --dataset ads-performance-v1 --granularity hourly \
#       --output schemas/ads-performance-v1.yaml
#
# Fields: 3 metadata, 57 dimensions (55 in the record key), 377 metrics.
#
# The record key is 55 of the 57 dimension fields; any others
# are carried as attributes and are annotated where they are declared. Omitting a key
# field causes two distinct records that agree on the remainder to be treated as
# versions of each other, and one of them to be discarded with no error reported.
#
# 'type' is an expectation, not a guarantee. It is compared against every
# delivered file and a lossy difference stops the job.

dataset: ads-performance-v1
granularity: hourly
restatement_days: 70
version_field: streamBatch.version

# Coarsest first. Date bounds the restatement window; advertiser bounds the
# many advertisers that accumulate in one delivery destination.
partition_columns:
  - date.value
  - advertiseraccount.id

# Named coarse-grain groupings available to the aggregate job, selected with --grain.
# Declared here rather than in deployment configuration so that a table's name and its
# grouping cannot diverge. Every grain must lead with the event-date column, because an
# aggregate rebuild overwrites whole event-date partitions.
aggregate_grains:
  campaign_day:
    - date.value
    - advertiseraccount.id
    - adproduct.value
    - campaign.id
  ad_group_day:
    - date.value
    - advertiseraccount.id
    - adproduct.value
    - campaign.id
    - adgroup.id
  # The only grain that keeps hour.value. This dataset is delivered hourly, so every other
  # grain here discards the intraday detail it arrives with, and a day total cannot be
  # un-summed back into hours. Kept separate rather than folded into campaign_day because it
  # multiplies the row count by up to 24 to answer a question most dashboards do not ask.
  campaign_hour:
    - date.value
    - hour.value
    - advertiseraccount.id
    - adproduct.value
    - campaign.id
  # Placement, device and geography drop campaign.id rather than adding to it. Each answers
  # "where did the spend go" across the whole account, and keeping campaign.id would make
  # them strictly finer than campaign_day and no cheaper to read than it.
  placement_day:
    - date.value
    - advertiseraccount.id
    - adproduct.value
    - placement.name
    - placementclassification.value
  device_day:
    - date.value
    - advertiseraccount.id
    - adproduct.value
    - devicetype.value
    - environment.value
  # country.code as well as country.name: the code is what a map visual geocodes against and
  # the name is what a table should display. Deriving either from the other would put a
  # country lookup somewhere nobody maintains.
  geo_day:
    - date.value
    - advertiseraccount.id
    - adproduct.value
    - country.code
    - country.name
    - region.name

