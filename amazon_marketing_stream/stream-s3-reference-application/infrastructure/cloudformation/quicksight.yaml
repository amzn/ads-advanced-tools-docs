            Columns:
              - Name: event_date
                Type: DATETIME
              # An integer, not a string. As a string the hour axis sorts 0, 1, 10, 11, 2 —
              # the same lexicographic trap that the date cast avoids.
              - Name: "hour.value"
                Type: INTEGER
              - Name: "advertiseraccount.id"
                Type: STRING
              - Name: "adproduct.value"
                Type: STRING
              - Name: "campaign.id"
                Type: STRING
              - Name: "metric.impressions"
                Type: INTEGER
              - Name: "metric.clicks"
                Type: INTEGER
              - Name: "metric.totalcost"
