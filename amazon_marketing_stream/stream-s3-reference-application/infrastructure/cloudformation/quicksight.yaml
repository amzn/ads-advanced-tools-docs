      PhysicalTableMap:
        campaign-hour:
          CustomSql:
            DataSourceArn: !GetAtt AthenaDataSource.Arn
            Name: campaign_hour
            # The only grain that keeps hour.value. The hourly dataset is delivered with
            # intraday detail that every other grain here sums away, and a day total cannot be
            # un-summed back into hours.
            SqlQuery: !Sub |
              SELECT CAST("date.value" AS DATE)  AS event_date,
                     "hour.value",
                     "advertiseraccount.id",
                     "adproduct.value",
                     "campaign.id",
                     "metric.impressions",
                     "metric.clicks",
                     "metric.totalcost"
