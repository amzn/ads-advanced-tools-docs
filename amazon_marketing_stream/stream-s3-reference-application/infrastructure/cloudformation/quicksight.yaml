AWSTemplateFormatVersion: '2010-09-09'

Description: >-
  Optional QuickSight layer: a stack-owned Athena execution path, ten datasets and an
  eleven-visual dashboard over staging tables. Deploy after staging has created its runtime
  databases and tables. The only external prerequisites are QuickSight account signup and an
  existing QuickSight user ARN.

# There is no CloudFormation resource for a QuickSight account subscription. Everything below
# assumes QuickSight is already signed up in this account and region, and QuickSight resource
# ownership still requires an existing regional user ARN. The dedicated service role, Athena
# workgroup, encrypted result storage and Lake Formation grants are owned here. In particular,
# this stack never reads or modifies aws-quicksight-service-role-v0.
#
# ---------------------------------------------------------------------------------------
# Why SPICE for the coarse tables and direct query for the fine one
#
# The coarse tables are small, pre-aggregated and rebuilt on a schedule, which is exactly what
# SPICE suits: import once per refresh, then serve reads from memory at no further query cost.
#
# The current-state table is the opposite. It is large, and the questions asked of it are
# ad hoc, so importing it would mean holding hundreds of millions of rows in SPICE to answer
# queries that change every time. It is registered as a direct-query dataset instead.
#
# Every dataset below is defined with CustomSql rather than by naming a table. A relational
# table definition has to declare each input column explicitly, and the current-state table has
# 437 of them; an explicit projection is both shorter and a statement of intent about which
# columns a dashboard is allowed to see.
# ---------------------------------------------------------------------------------------

Metadata:
  AWS::CloudFormation::Interface:
    ParameterGroups:
      - Label:
          default: QuickSight identity (see prerequisites above)
        Parameters:
          - QuickSightUserArn
          - QuickSightLakeFormationPrincipalArn
      - Label:
          default: Where the data is
        Parameters:
          - TableBucketArn
          - AthenaCatalogName
          - PerformanceDatasetId
          - ConvertedProductDatasetId
      - Label:
          default: Naming and refresh
        Parameters:
          - DeploymentName
          - SpiceRefreshTimeOfDay
          - SpiceRefreshTimeZone

Parameters:
  QuickSightUserArn:
    Type: String
    AllowedPattern: '^arn:aws.*:quicksight:.+:\d{12}:user/.+$'
    ConstraintDescription: >-
      must be a QuickSight user ARN, for example
      arn:aws:quicksight:us-east-1:111122223333:user/default/alice
    Description: >-
      Principal granted ownership of everything this template creates. Find it with
      `aws quicksight list-users --aws-account-id <id> --namespace default`. Deliberately has no
      default: a QuickSight principal is account-specific and cannot be guessed.

  # A second identity parameter, and not a duplicate of the one above. QuickSightUserArn is
  # consumed by AWS::QuickSight::DataSet, ::DataSource and ::Dashboard, whose Permissions.Principal
  # requires a QuickSight user or group ARN. Lake Formation's DataLakePrincipalIdentifier requires
  # an IAM principal ARN and rejects a quicksight: one. A live deploy proved it: the five User
  # grants below all failed with AccessDenied -- "Resource does not exist or requester is not
  # authorized to access requested permissions" -- while the five sibling Role grants, identical
  # but for an IAM role ARN, succeeded. One parameter cannot satisfy both consumers, so there are
  # two.
  #
  # A federated QuickSight user is addressed by the IAM role behind it, which is what goes here.
  #
  # Left empty, the five User grants are skipped rather than created with a value known to fail.
  # That is a safe default: the Athena data source passes AthenaParameters.RoleArn naming the role
  # this stack creates, so every dataset and the dashboard read through the Role grants. What the
  # User grants add is the ability for a human to query the same tables directly in the Athena
  # console. Supply this parameter if you want that; leave it empty and the dashboard still works.
  QuickSightLakeFormationPrincipalArn:
    Type: String
    Default: ''
    AllowedPattern: '^$|^arn:aws[^:]*:iam::\d{12}:(role|user)/.+$'
    ConstraintDescription: >-
      must be empty, or an IAM role or user ARN, for example
      arn:aws:iam::111122223333:role/Analyst
    Description: >-
      IAM principal granted Lake Formation SELECT/DESCRIBE on the staging databases, so a human
      can query them in the Athena console. Must be an IAM ARN, not a QuickSight one: Lake
      Formation rejects a quicksight: user ARN with AccessDenied. A federated QuickSight user is
      addressed by its underlying IAM role. Leave empty to skip those grants entirely; the
      dashboard does not depend on them.

  AthenaCatalogName:
    Type: String
    Default: datalake
    MinLength: 1
    Description: >-
      Athena catalog holding the staging tables, as Athena addresses it. For S3 Tables reached
      through Glue this is usually 's3tablescatalog/<table-bucket-name>' rather than a short
      name, so check in the Athena console before deploying. Getting this wrong produces a
      dataset that validates and returns nothing.

  TableBucketArn:
    Type: String
    AllowedPattern: '^arn:aws[^:]*:s3tables:[^:]+:\d{12}:bucket/.+$'
    ConstraintDescription: must be an S3 Tables table-bucket ARN
    Description: >-
      ARN exported by the staging stack. This is always required because it scopes IAM table
      reads even when AthenaCatalogName overrides the catalog's logical name.

  PerformanceDatasetId:
    Type: String
    Default: ads_performance_v1
    Description: >-
      Snake-case table stem of the hourly dataset. Note the underscores: the delivered
      identifier is hyphenated, but table names are normalised because S3 Tables through Glue
      rejects hyphens.

  ConvertedProductDatasetId:
    Type: String
    Default: ads_converted_product_v1
    Description: Snake-case table stem of the daily dataset.

  DeploymentName:
    Type: String
    Default: stream-staging
    AllowedPattern: '^[a-z0-9-]+$'
    Description: Prefix for the QuickSight resource ids this template creates.

  SpiceRefreshTimeOfDay:
    Type: String
    Default: '05:00'
    AllowedPattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$'
    Description: >-
      Daily SPICE refresh time, HH:MM. Schedule it after the aggregate job has rebuilt the
      partitions for the period you care about, or the refresh imports yesterday's numbers.

  SpiceRefreshTimeZone:
    Type: String
    Default: UTC
    Description: Time zone for the refresh schedule, as an IANA name.

Conditions:
  # Gates the five User*Permissions grants. Nothing in the template may DependsOn a resource
  # carrying this condition: CloudFormation does not drop such a dependency, it skips the
  # depending resource too -- "if a resource with a condition isn't created, any resources that
  # depend on that resource aren't created either, regardless of their own conditions". An entry
  # for one of these in AthenaDataSource's DependsOn would therefore delete the data source, and
  # with it every dataset and the dashboard, the moment this parameter was left empty.
  HasLakeFormationPrincipal: !Not [!Equals [!Ref QuickSightLakeFormationPrincipalArn, '']]

Resources:
  # -------------------------------------------------------------------------------------
  # Stack-owned QuickSight execution path
  # -------------------------------------------------------------------------------------

  AthenaResultsKey:
    Type: AWS::KMS::Key
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      Description: !Sub 'Encrypts QuickSight Athena results for ${AWS::StackName}. Access logs use SSE-S3.'
      EnableKeyRotation: true
      KeyPolicy:
        Version: '2012-10-17'
        Statement:
          - Sid: AllowAccountAdministration
            Effect: Allow
            Principal:
              AWS: !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:root'
            Action: 'kms:*'
            Resource: '*'
          # No statement for logging.s3.amazonaws.com. There was one, to let server access log
          # delivery encrypt with this key — but SSE-KMS is not supported for a server access log
          # destination bucket in the first place, so the access-log bucket uses SSE-S3 and this
          # key is never asked to encrypt a log object. A grant for a principal that cannot use
          # it only widens the key policy.

  AthenaResultsKeyAlias:
    Type: AWS::KMS::Alias
    Properties:
      AliasName: !Sub 'alias/${AWS::StackName}-athena-results'
      TargetKeyId: !Ref AthenaResultsKey

  AthenaAccessLogBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      BucketName: !Sub '${DeploymentName}-quicksight-logs-${AWS::AccountId}-${AWS::Region}'
      # ACLs are disabled; access is controlled by policy only.
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      # all four bucket-level public access controls are enabled. This stack never changes the
      # account-level public access block.
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      # SSE-S3, not AthenaResultsKey. S3 server access log delivery does not support SSE-KMS on
      # the destination bucket, so a customer-managed key here means no logs are ever written
      # and nothing reports it. The query-results bucket below is not a log destination and does
      # use the key.
      # https://docs.aws.amazon.com/AmazonS3/latest/userguide/enable-server-access-logging.html
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      VersioningConfiguration:
        Status: Enabled
      LifecycleConfiguration:
        Rules:
          - Id: ExpireAccessLogs
            Status: Enabled
            ExpirationInDays: 90
            NoncurrentVersionExpirationInDays: 7
          - Id: AbortIncompleteUploads
            Status: Enabled
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 7

  AthenaAccessLogBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref AthenaAccessLogBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          # only S3 log delivery may write, only under logs/, and only for a source bucket in this
          # account.
          - Sid: AllowLogDelivery
            Effect: Allow
            Principal:
              Service: logging.s3.amazonaws.com
            Action: 's3:PutObject'
            Resource: !Sub '${AthenaAccessLogBucket.Arn}/logs/*'
            Condition:
              StringEquals:
                'aws:SourceAccount': !Ref AWS::AccountId
          - Sid: DenyUnencryptedTransport
            Effect: Deny
            Principal: '*'
            Action: 's3:*'
            Resource:
              - !GetAtt AthenaAccessLogBucket.Arn
              - !Sub '${AthenaAccessLogBucket.Arn}/*'
            Condition:
              Bool:
                'aws:SecureTransport': false

  AthenaResultsBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      BucketName: !Sub '${DeploymentName}-quicksight-results-${AWS::AccountId}-${AWS::Region}'
      # ACLs are disabled; access is controlled by policy only.
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      # all four bucket-level public access controls are enabled. This stack never changes the
      # account-level public access block.
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: 'aws:kms'
              KMSMasterKeyID: !GetAtt AthenaResultsKey.Arn
            BucketKeyEnabled: true
      VersioningConfiguration:
        Status: Enabled
      # access logging is policy-based so BucketOwnerEnforced can remain enabled without an ACL
      # grant.
      LoggingConfiguration:
        DestinationBucketName: !Ref AthenaAccessLogBucket
        LogFilePrefix: logs/
      LifecycleConfiguration:
        Rules:
          - Id: ExpireQueryResults
            Status: Enabled
            ExpirationInDays: 7
            NoncurrentVersionExpirationInDays: 7
          - Id: AbortIncompleteUploads
            Status: Enabled
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 7

  AthenaResultsBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref AthenaResultsBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: DenyUnencryptedTransport
            Effect: Deny
            Principal: '*'
            Action: 's3:*'
            Resource:
              - !GetAtt AthenaResultsBucket.Arn
              - !Sub '${AthenaResultsBucket.Arn}/*'
            Condition:
              Bool:
                'aws:SecureTransport': false

  AthenaWorkGroup:
    Type: AWS::Athena::WorkGroup
    Properties:
      Name: !Sub '${DeploymentName}-quicksight'
      RecursiveDeleteOption: true
      WorkGroupConfiguration:
        EnforceWorkGroupConfiguration: true
        PublishCloudWatchMetricsEnabled: true
        RequesterPaysEnabled: false
        ResultConfiguration:
          ExpectedBucketOwner: !Ref AWS::AccountId
          OutputLocation: !Sub 's3://${AthenaResultsBucket}/results/'
          EncryptionConfiguration:
            EncryptionOption: SSE_KMS
            KmsKey: !GetAtt AthenaResultsKey.Arn

  QuickSightRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${DeploymentName}-quicksight'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          # scoped to this account, so the QuickSight service principal cannot be induced to assume
          # this role on behalf of another customer. The role reads delivered advertiser data and
          # the query-result bucket, so an unconditioned service-principal trust is a
          # confused-deputy exposure. The SchedulerRole in the staging stack carries the same
          # condition.
          #
          # Not verifiable here, and worth stating plainly: AWS's general guidance is to use
          # aws:SourceAccount for "all services with service principals that have been given
          # access to resources in your account", but AWS's own QuickSight documentation shows
          # this trust policy *without* a condition, and QuickSight publishes no confused-deputy
          # page of its own, so whether QuickSight sends the key is unconfirmed. The condition is
          # set anyway: an unsupported condition makes the role unassumable, so the first deploy
          # fails loudly and the problem is discoverable, whereas omitting the condition fails
          # silently and forever. See docs/verification.md.
          - Effect: Allow
            Principal:
              Service: quicksight.amazonaws.com
            Action: 'sts:AssumeRole'
            Condition:
              StringEquals:
                'aws:SourceAccount': !Ref AWS::AccountId
      Policies:
        - PolicyName: QuickSightAthenaAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - 'athena:GetWorkGroup'
                  - 'athena:StartQueryExecution'
                  - 'athena:StopQueryExecution'
                  - 'athena:GetQueryExecution'
                  - 'athena:GetQueryResults'
                  - 'athena:GetQueryResultsStream'
                  - 'athena:ListQueryExecutions'
                Resource: !Sub 'arn:${AWS::Partition}:athena:${AWS::Region}:${AWS::AccountId}:workgroup/${DeploymentName}-quicksight'
              - Effect: Allow
                Action:
                  - 's3:GetBucketLocation'
                  - 's3:ListBucket'
                  - 's3:ListBucketMultipartUploads'
                Resource: !GetAtt AthenaResultsBucket.Arn
              - Effect: Allow
                Action:
                  - 's3:GetObject'
                  - 's3:PutObject'
                  - 's3:DeleteObject'
                  - 's3:AbortMultipartUpload'
                Resource: !Sub '${AthenaResultsBucket.Arn}/results/*'
              - Effect: Allow
                Action:
                  - 'kms:Decrypt'
                  - 'kms:Encrypt'
                  - 'kms:GenerateDataKey'
                  - 'kms:DescribeKey'
                Resource: !GetAtt AthenaResultsKey.Arn
              - Effect: Allow
                Action:
                  - 's3tables:GetTableBucket'
                  - 's3tables:ListNamespaces'
                  - 's3tables:GetNamespace'
                  - 's3tables:ListTables'
                  - 's3tables:GetTable'
                  - 's3tables:GetTableData'
                  - 's3tables:GetTableMetadataLocation'
                Resource:
                  - !Ref TableBucketArn
                  - !Sub '${TableBucketArn}/table/*'
              - Effect: Allow
                Action:
                  - 'glue:GetCatalog'
                  - 'glue:GetDatabase'
                  - 'glue:GetDatabases'
                  - 'glue:GetTable'
                  - 'glue:GetTables'
                  - 'glue:GetPartition'
                  - 'glue:GetPartitions'
                  - 'glue:BatchGetPartition'
                Resource:
                  # The account's own default catalog, addressed by the bare ':catalog' resource,
                  # which is not any of the three below. Athena resolves a catalog named in the
                  # SQL by first reading the default catalog of the account it is querying, so
                  # without this entry resolution stops before the nested catalog is ever
                  # consulted and the query fails with CATALOG_NOT_FOUND.
                  #
                  # Measured on a live deployment rather than reasoned about, because three
                  # earlier readings of the same error were wrong. A role holding this policy
                  # verbatim, assumed by an ordinary caller, reproduced CATALOG_NOT_FOUND on
                  # SELECT count(*) FROM "<nested-catalog>"."current"."ads_performance_v1";
                  # adding this one ARN and nothing else, the same query succeeded and returned
                  # the table's rows. Adding glue:GetCatalogs instead, with this ARN still
                  # absent, failed identically — so the missing grant is this resource and not
                  # that action, and the role's trust condition, which the error was previously
                  # attributed to, is not involved.
                  - !Sub 'arn:${AWS::Partition}:glue:${AWS::Region}:${AWS::AccountId}:catalog'
                  # Both the parent catalog and the per-table-bucket catalog nested under it.
                  # S3 Tables surfaces each table bucket as its own nested Glue catalog, and the
                  # generated SQL names that nested one. Granting only the parent makes
                  # glue:GetCatalog fail on the nested id, which Athena reports as
                  # CATALOG_NOT_FOUND rather than as an access denial — so the failure names the
                  # catalog rather than the missing permission.
                  - !Sub
                    - 'arn:${AWS::Partition}:glue:${AWS::Region}:${AWS::AccountId}:catalog/${CatalogRoot}'
                    - CatalogRoot: !Select [0, !Split ['/', !Ref AthenaCatalogName]]
                  - !Sub 'arn:${AWS::Partition}:glue:${AWS::Region}:${AWS::AccountId}:catalog/${AthenaCatalogName}'
                  - !Sub 'arn:${AWS::Partition}:glue:${AWS::Region}:${AWS::AccountId}:database/${AthenaCatalogName}/current'
                  - !Sub 'arn:${AWS::Partition}:glue:${AWS::Region}:${AWS::AccountId}:database/${AthenaCatalogName}/aggregate'
                  - !Sub 'arn:${AWS::Partition}:glue:${AWS::Region}:${AWS::AccountId}:table/${AthenaCatalogName}/current/*'
                  - !Sub 'arn:${AWS::Partition}:glue:${AWS::Region}:${AWS::AccountId}:table/${AthenaCatalogName}/aggregate/*'
              # Lake Formation GetDataAccess does not support resource-level permissions, so the API
              # requires '*'; this role has no grant-management actions.
              - Effect: Allow
                Action: 'lakeformation:GetDataAccess'
                Resource: '*'

  # Resource.Catalog is a CatalogResource object, so the identifier goes under 'Id'. Verified
  # against the published registry schema, which is what CloudFormation validates with:
  #   CatalogResource: {type: object, properties: {Id: CatalogIdString}, additionalProperties: false}
  # from https://schema.cloudformation.us-east-1.amazonaws.com/CloudformationSchema.zip
  # (aws-lakeformation-principalpermissions.json).
  #
  # A bare identifier instead is accepted by cfn-lint and by CDK's typing, and rejected by
  # CloudFormation at create — and because AthenaDataSource DependsOn the Role grants below, that
  # failure takes the whole stack with it. The Database and Table grants further down nest the
  # same value under CatalogId.
  #
  # E3012 is suppressed per-resource, not globally: cfn-lint ships no schema for
  # AWS::LakeFormation::PrincipalPermissions and falls back to the legacy resource spec, which
  # predates CatalogResource and still types this as a string. Scoped here so E3012 keeps its
  # teeth everywhere else.
  RoleCatalogPermissions:
    Type: AWS::LakeFormation::PrincipalPermissions
    Metadata:
      cfn-lint:
        config:
          ignore_checks:
            - E3012
    Properties:
      Principal:
        DataLakePrincipalIdentifier: !GetAtt QuickSightRole.Arn
      Resource:
        Catalog:
          Id: !Sub '${AWS::AccountId}:${AthenaCatalogName}'
      Permissions: [DESCRIBE]
      PermissionsWithGrantOption: []

  # The five User* grants below are for a human querying these tables in the Athena console, and
  # are skipped unless QuickSightLakeFormationPrincipalArn is supplied. They take an IAM ARN, not
  # the quicksight: user ARN: a live deploy showed all five failing with AccessDenied while the
  # Role grants succeeded.
  UserCatalogPermissions:
    Type: AWS::LakeFormation::PrincipalPermissions
    Condition: HasLakeFormationPrincipal
    Metadata:
      cfn-lint:
        config:
          ignore_checks:
            - E3012
    Properties:
      Principal:
        DataLakePrincipalIdentifier: !Ref QuickSightLakeFormationPrincipalArn
      Resource:
        Catalog:
          Id: !Sub '${AWS::AccountId}:${AthenaCatalogName}'
      Permissions: [DESCRIBE]
      PermissionsWithGrantOption: []

  RoleCurrentDatabasePermissions:
    Type: AWS::LakeFormation::PrincipalPermissions
    Properties:
      Principal:
        DataLakePrincipalIdentifier: !GetAtt QuickSightRole.Arn
      Resource:
        Database:
          CatalogId: !Sub '${AWS::AccountId}:${AthenaCatalogName}'
          Name: current
      Permissions: [DESCRIBE]
      PermissionsWithGrantOption: []

  UserCurrentDatabasePermissions:
    Type: AWS::LakeFormation::PrincipalPermissions
    Condition: HasLakeFormationPrincipal
    Properties:
      Principal:
        DataLakePrincipalIdentifier: !Ref QuickSightLakeFormationPrincipalArn
      Resource:
        Database:
          CatalogId: !Sub '${AWS::AccountId}:${AthenaCatalogName}'
          Name: current
      Permissions: [DESCRIBE]
      PermissionsWithGrantOption: []

  RoleAggregateDatabasePermissions:
    Type: AWS::LakeFormation::PrincipalPermissions
    Properties:
      Principal:
        DataLakePrincipalIdentifier: !GetAtt QuickSightRole.Arn
      Resource:
        Database:
          CatalogId: !Sub '${AWS::AccountId}:${AthenaCatalogName}'
          Name: aggregate
      Permissions: [DESCRIBE]
      PermissionsWithGrantOption: []

  UserAggregateDatabasePermissions:
    Type: AWS::LakeFormation::PrincipalPermissions
    Condition: HasLakeFormationPrincipal
    Properties:
      Principal:
        DataLakePrincipalIdentifier: !Ref QuickSightLakeFormationPrincipalArn
      Resource:
        Database:
          CatalogId: !Sub '${AWS::AccountId}:${AthenaCatalogName}'
          Name: aggregate
      Permissions: [DESCRIBE]
      PermissionsWithGrantOption: []

  RoleCurrentTablePermissions:
    Type: AWS::LakeFormation::PrincipalPermissions
    Properties:
      Principal:
        DataLakePrincipalIdentifier: !GetAtt QuickSightRole.Arn
      Resource:
        Table:
          CatalogId: !Sub '${AWS::AccountId}:${AthenaCatalogName}'
          DatabaseName: current
          TableWildcard: {}
      Permissions: [SELECT, DESCRIBE]
      PermissionsWithGrantOption: []

  UserCurrentTablePermissions:
    Type: AWS::LakeFormation::PrincipalPermissions
    Condition: HasLakeFormationPrincipal
    Properties:
      Principal:
        DataLakePrincipalIdentifier: !Ref QuickSightLakeFormationPrincipalArn
      Resource:
        Table:
          CatalogId: !Sub '${AWS::AccountId}:${AthenaCatalogName}'
          DatabaseName: current
          TableWildcard: {}
      Permissions: [SELECT, DESCRIBE]
      PermissionsWithGrantOption: []

  RoleAggregateTablePermissions:
    Type: AWS::LakeFormation::PrincipalPermissions
    Properties:
      Principal:
        DataLakePrincipalIdentifier: !GetAtt QuickSightRole.Arn
      Resource:
        Table:
          CatalogId: !Sub '${AWS::AccountId}:${AthenaCatalogName}'
          DatabaseName: aggregate
          TableWildcard: {}
      Permissions: [SELECT, DESCRIBE]
      PermissionsWithGrantOption: []

  UserAggregateTablePermissions:
    Type: AWS::LakeFormation::PrincipalPermissions
    Condition: HasLakeFormationPrincipal
    Properties:
      Principal:
        DataLakePrincipalIdentifier: !Ref QuickSightLakeFormationPrincipalArn
      Resource:
        Table:
          CatalogId: !Sub '${AWS::AccountId}:${AthenaCatalogName}'
          DatabaseName: aggregate
          TableWildcard: {}
      Permissions: [SELECT, DESCRIBE]
      PermissionsWithGrantOption: []

  # -------------------------------------------------------------------------------------
  # Data source
  # -------------------------------------------------------------------------------------

  # DependsOn names the five Role grants and not the five User ones, for two reasons that point
  # the same way.
  #
  # Correctness: the User grants are now conditional, and DependsOn does not support an intrinsic
  # function, so the list cannot be made conditional with it. CloudFormation does not drop a
  # dependency on a resource a false condition excluded -- it skips the depending resource as
  # well. Naming one here would therefore delete this data source, and every dataset and the
  # dashboard that reference it, whenever QuickSightLakeFormationPrincipalArn was left empty.
  #
  # Meaning: this data source reads through the role, because AthenaParameters.RoleArn below names
  # it. The Role grants are the ones that must exist first. The User grants are for a human in the
  # Athena console and have no bearing on whether a dataset validates, so waiting for them never
  # bought anything.
  AthenaDataSource:
    Type: AWS::QuickSight::DataSource
    DependsOn:
      - RoleCatalogPermissions
      - RoleCurrentDatabasePermissions
      - RoleAggregateDatabasePermissions
      - RoleCurrentTablePermissions
      - RoleAggregateTablePermissions
    Properties:
      AwsAccountId: !Ref AWS::AccountId
      DataSourceId: !Sub '${DeploymentName}-athena'
      Name: !Sub '${DeploymentName} staging layer (Athena)'
      Type: ATHENA
      DataSourceParameters:
        AthenaParameters:
          RoleArn: !GetAtt QuickSightRole.Arn
          WorkGroup: !Ref AthenaWorkGroup
      SslProperties:
        DisableSsl: false
      Permissions:
        - Principal: !Ref QuickSightUserArn
          Actions:
            - 'quicksight:DescribeDataSource'
            - 'quicksight:DescribeDataSourcePermissions'
            - 'quicksight:PassDataSource'
            - 'quicksight:UpdateDataSource'
            - 'quicksight:DeleteDataSource'
            - 'quicksight:UpdateDataSourcePermissions'

  # -------------------------------------------------------------------------------------
  # Datasets
  #
  # "date.value" is stored as a string, because that is how it is delivered. It is cast to a date
  # here so QuickSight treats it as a time axis rather than as a category; left as a string, a
  # line chart orders it lexicographically and any date filter is a string comparison.
  # -------------------------------------------------------------------------------------

  CampaignDayDataSet:
    Type: AWS::QuickSight::DataSet
    Properties:
      AwsAccountId: !Ref AWS::AccountId
      DataSetId: !Sub '${DeploymentName}-campaign-day'
      Name: !Sub '${DeploymentName} — campaign by day (SPICE)'
      ImportMode: SPICE
      PhysicalTableMap:
        campaign-day:
          CustomSql:
            DataSourceArn: !GetAtt AthenaDataSource.Arn
            Name: campaign_day
            SqlQuery: !Sub |
              SELECT CAST("date.value" AS DATE)  AS event_date,
                     "advertiseraccount.id",
