  # Breakdown datasets
  #
  # One per additional coarse grain. Each drops "campaign.id" and groups by a single attribute
  # instead, so each answers "where did the spend go" across the account rather than being a
  # finer cut of campaign_day. They are separate datasets rather than one wide one because
