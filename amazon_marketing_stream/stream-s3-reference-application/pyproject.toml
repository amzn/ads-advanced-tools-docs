[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "stream-s3-reference-application"
version = "0.1.0"
description = "Reference application for consuming S3 change-data deliveries into a queryable staging layer."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT-0"
license-files = ["LICENSE"]
# A role rather than a named individual, so that a public repository does not direct contact at
# one person. The Issues URL below is where to raise something.
authors = [{ name = "Solution Architect" }]
keywords = ["change-data-capture", "apache-iceberg", "s3-tables", "athena", "spark"]


# Runtime dependencies are deliberately minimal. The correctness core is pure
# Python plus pyarrow so that it can be unit tested without a Spark cluster.
# Spark itself is provided by the managed runtime (AWS Glue)
# and is therefore declared as an optional extra rather than a hard dependency.
dependencies = [
    "boto3>=1.34,<2",
    # Capped at the newest major the suite has run against. pyarrow reads the delivered Parquet
    # footers, and its type mapping is what the correctness rules depend on: a decimal read as an
    # integer zeroes every money column without raising. A new major is adopted by raising the
    # cap and regenerating requirements-lock.txt, deliberately, not by an install picking it up.
    "pyarrow>=14,<24",
    "PyYAML>=6,<7",
]

# Where a reader of the built wheel goes to find the source. Without these, the package metadata
# is a dead end: nothing in a distribution points back at the repository it came from.
[project.urls]
Homepage = "https://github.com/amzn/ads-advanced-tools-docs/tree/main/amazon_marketing_stream/stream-s3-reference-application"
Repository = "https://github.com/amzn/ads-advanced-tools-docs"
Issues = "https://github.com/amzn/ads-advanced-tools-docs/issues"

[project.optional-dependencies]
# Only needed to execute the Spark adapters locally. The managed runtimes ship
# their own Spark build, so pinning a version here would be actively misleading.
spark = ["pyspark>=3.5,<4"]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.6",
    # Enforces the typing the package already promises by shipping py.typed. Without it those
    # annotations are a claim nothing checks, and a wrong one reaches every consumer's checker.
    "mypy>=1.11",
    "types-PyYAML",
    # Validates the CloudFormation templates against the AWS resource schemas. The template
    # tests read the template and assert the template, so they cannot catch a shape both
    # engines get wrong.
    "cfn-lint>=1",
    # Needed by "make deploy-staging", which builds the wheel the Glue jobs import. Declared
    # here so that deploying does not require a separate "pip install build" the README has to
    # remember to mention.
    "build>=1",
    # Included so that "make test" runs the Spark integration tests rather than skipping
    # them. They execute the real generated MERGE INTO against a local Iceberg catalog,
    # which is the only thing that proves the generated SQL and the Python reference agree.
    "pyspark>=3.5,<4",
]

[project.scripts]
stream-generate-schema = "stream_staging.cli.generate_schema:main"
stream-generate-inspection-tables = "stream_staging.cli.generate_inspection_tables:main"
stream-subscription = "stream_staging.cli.subscription:main"
stream-ingest = "stream_staging.jobs.ingest:main"
stream-merge = "stream_staging.jobs.merge:main"
stream-aggregate = "stream_staging.jobs.aggregate:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# The dataset definitions and the column lockfile are data the jobs read at runtime, not
# development-time assets. Without them in the wheel a Glue run fails while loading its schema.
stream_staging = ["py.typed", "schemas/*.yaml", "schemas/*.json"]

# ---------------------------------------------------------------------------
# Lint and format
# ---------------------------------------------------------------------------

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # import ordering
    "B",    # bugbear
    "C4",   # comprehensions
    "UP",   # pyupgrade
    "SIM",  # simplify
    "RET",  # return consistency
    "ARG",  # unused arguments
    "PTH",  # prefer pathlib
    "RUF",
]
ignore = [
    # Long SQL literals are clearer left intact than wrapped.
    "E501",
]

[tool.ruff.lint.per-file-ignores]
# Tests legitimately use assert and long parametrised tables.
"tests/**" = ["ARG001", "ARG002"]

# Writers implement the TableWriter contract, so every method takes the dataset schema whether
# or not that particular format needs it. Dropping the parameter from the overrides that happen
# not to use it would break the interface, and renaming it to _schema would obscure what it is.
"src/stream_staging/writers/*.py" = ["ARG002"]

# ---------------------------------------------------------------------------
# Types
# ---------------------------------------------------------------------------

[tool.mypy]
strict = true
# pyspark and boto3 ship no type information. Without this, every import of them is an error
# and the real findings are lost in the noise.
ignore_missing_imports = true
# No python_version. Pinning the floor here would check one version on every runner. CI runs this
# on each interpreter in its matrix, so each one is checked against itself — which is what the
# supported range actually needs.

# ---------------------------------------------------------------------------
# Tests
# ---------------------------------------------------------------------------

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    # Release gates are deselected by default. They assert things that must be true before
    # publishing and are deliberately false during development -- an unresolved repository URL,
    # for one -- so running them in the ordinary suite would leave it permanently red and
    # train everybody to ignore it. "make release-check" selects them.
    "-m",
    "not release",
]
markers = [
    "spark: executes real Spark. Requires PySpark and a JDK; skipped when either is absent.",
    "release: a gate that must pass before publishing, not during development. Deselected by default; run with 'make release-check'.",
]
